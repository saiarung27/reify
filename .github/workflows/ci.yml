name: ci

# Runs the full test suite plus the user-value release gate on every push
# and pull request to ``main``. Per FIRST_PRINCIPLES.md commandment 5,
# user-value gating is mandatory; benchmark scoring (LongMemEval / LoCoMo /
# BEAM) is informational and added per release branch when the relevant
# datasets are available.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + user-value gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Reify targets 3.11+ in pyproject; we pin the floor (3.11) and
        # the two latest stable releases (3.12, 3.13) so regressions
        # specific to either end of the range land here.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          # ``-e .`` so the version reported by `reify version` reflects
          # the workspace, not a wheel from an earlier build.
          python -m pip install -e ".[dev]" || python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Run test suite
        run: python -m pytest -q

      - name: User-value release gate
        run: python -m reify eval user-value

      - name: LongMemEval fixture (proxy)
        run: python -m reify eval longmemeval-fixture

      - name: LoCoMo fixture (proxy)
        run: python -m reify eval locomo

  demo:
    name: wedge demo (no LLM)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fresh-clone install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Wedge demo (deterministic, no API keys)
        env:
          # Explicitly clear any LLM env to assert the demo runs LLM-free.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OLLAMA_BASE_URL: ""
        run: ./scripts/demo.sh
